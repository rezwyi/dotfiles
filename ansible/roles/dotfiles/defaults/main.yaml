---
dotfiles_system_username: foobar
dotfiles_system_user_group: "{{ dotfiles_system_username }}"
dotfiles_system_user_home: /home/{{ dotfiles_system_username }}
dotfiles_system_user_config_dir: "{{ dotfiles_system_user_home }}/.config"
dotfiles_system_user_local_bin_dir: "{{ dotfiles_system_user_home }}/.local/bin"
dotfiles_system_user_local_share_dir: "{{ dotfiles_system_user_home }}/.local/share"
dotfiles_system_user_templates_dir: "{{ dotfiles_system_user_home }}/.templates"

dotfiles_git_username: foobar
dotfiles_git_user_email: foo@bar.baz

dotfiles_zsh_theme: gnzh.no-ruby-prompt
dotfiles_zsh_oh_my_zsh_reinstall: false
dotfiles_zshrc_source_files:
  - .shell_aliases
  - .shell_autocomp
  - .shell_envs
  - .shell_funcs
  - .work_dirs

dotfiles_tmux_theme: solarized-light

dotfiles_vim_nerdtree_version: bc606c4

dotfiles_kitty_version: 0.47.4
dotfiles_kitty_theme: solarized-light
dotfiles_kitty_font_family: monospace
dotfiles_kitty_font_size: 12
dotfiles_kitty_window_columns: 120
dotfiles_kitty_window_rows: 48
dotfiles_kitty_window_padding: 15
dotfiles_kitty_background_opacity: "0.94"
dotfiles_kitty_background_image: false

dotfiles_k8s_kubectl_version: 1.29.1
dotfiles_k8s_k9s_version: 0.32.3
dotfiles_k8s_k9s_theme: solarized-light
dotfiles_k8s_k9s_shell_pod_image: busybox:1.36.1
dotfiles_k8s_k9s_shell_pod_namespace: default
dotfiles_k8s_krew_version: 0.4.4
dotfiles_k8s_helm_version: 3.17.3
dotfiles_k8s_krew_plugins:
  - krew
  - deprecations
  - outdated

dotfiles_docker_version: 29.9.3
dotfiles_docker_containerd_version: 2.4.2-3
dotfiles_docker_buildx_version: 0.38.1-1
dotfiles_docker_compose_version: 5.7.0-1
dotfiles_docker_apt_arch: "{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') | replace('armv7l', 'armhf') }}"
dotfiles_docker_apt_version_suffix: "~ubuntu.{{ ansible_distribution_version }}~{{ ansible_distribution_release }}"
dotfiles_docker_ce_package: "docker-ce=5:{{ dotfiles_docker_version }}-1{{ dotfiles_docker_apt_version_suffix }}"
dotfiles_docker_cli_package: "docker-ce-cli=5:{{ dotfiles_docker_version }}-1{{ dotfiles_docker_apt_version_suffix }}"
dotfiles_docker_containerd_package: "containerd.io={{ dotfiles_docker_containerd_version }}{{ dotfiles_docker_apt_version_suffix }}"
dotfiles_docker_buildx_package: "docker-buildx-plugin={{ dotfiles_docker_buildx_version }}{{ dotfiles_docker_apt_version_suffix }}"
dotfiles_docker_compose_package: "docker-compose-plugin={{ dotfiles_docker_compose_version }}{{ dotfiles_docker_apt_version_suffix }}"
dotfiles_docker_log_driver: json-file
dotfiles_docker_log_max_size: 10m
dotfiles_docker_log_max_file: "3"
dotfiles_docker_live_restore: true
dotfiles_docker_packages:
  - "{{ dotfiles_docker_ce_package }}"
  - "{{ dotfiles_docker_cli_package }}"
  - "{{ dotfiles_docker_containerd_package }}"
  - "{{ dotfiles_docker_buildx_package }}"
  - "{{ dotfiles_docker_compose_package }}"

dotfiles_yc_disk_dir: "{{ dotfiles_system_user_home }}/my-disk"
dotfiles_yc_disk_config_dir: "{{ dotfiles_system_user_config_dir }}/yandex-disk"
dotfiles_yc_disk_exclude_dirs: ""
dotfiles_yc_disk_systemd_enabled: false

dotfiles_testssl_sh_version: 3.0.9

dotfiles_wttr_in_location: London

dotfiles_security_upgrade: true
dotfiles_security_unattended_upgrades: true
dotfiles_security_ptrace_restrict: false # CVE-2026-46333 (ssh-keysign-pwn); breaks non-root gdb/strace attach
dotfiles_security_blacklisted_modules:
  - algif_aead # CVE-2026-31431 (Copy Fail)
  - esp4 # CVE-2026-43284 (Dirty Frag), CVE-2026-46300 (Fragnesia); breaks IPsec
  - esp6 # CVE-2026-43284 (Dirty Frag), CVE-2026-46300 (Fragnesia); breaks IPsec
  - rxrpc # CVE-2026-43500 (Dirty Frag); breaks AFS
  - act_pedit # CVE-2026-46331 (pedit COW)
  - rds # CVE-2026-43494 (PinTheft)