---
- name: Reload daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart yandex-disk
  ansible.builtin.systemd:
    name: yandex-disk
    enabled: true
    state: restarted

- name: Update initramfs
  ansible.builtin.command:
    cmd: update-initramfs -u -k all
  changed_when: true

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
