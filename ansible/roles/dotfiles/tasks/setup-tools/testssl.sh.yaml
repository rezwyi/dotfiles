---
- name: Ensure all directories exists
  ansible.builtin.file:
    path: "{{ dotfiles_system_user_local_share_dir }}/{{ __item }}"
    owner: "{{ dotfiles_system_username }}"
    group: "{{ dotfiles_system_user_group }}"
    mode: "0755"
    state: directory
  loop:
    - testssl.sh
  loop_control:
    loop_var: __item

- name: Download testssl.sh
  ansible.builtin.get_url:
    url: https://github.com/testssl/testssl.sh/archive/refs/tags/v{{ dotfiles_testssl_sh_version }}.tar.gz
    dest: /tmp/testssl.sh-{{ dotfiles_testssl_sh_version }}.tar.gz
    mode: "0644"
    timeout: 60
  register: __download_testssl_sh
  until: __download_testssl_sh is succeeded
  retries: 5
  delay: 2

- name: Install testssl.sh
  ansible.builtin.unarchive:
    src: /tmp/testssl.sh-{{ dotfiles_testssl_sh_version }}.tar.gz
    dest: "{{ dotfiles_system_user_local_share_dir }}/testssl.sh"
    owner: "{{ dotfiles_system_username }}"
    group: "{{ dotfiles_system_user_group }}"
    mode: "0755"
    remote_src: true

- name: Create symbolic link
  ansible.builtin.file:
    src: "{{ dotfiles_system_user_local_share_dir }}/testssl.sh/testssl.sh-{{ dotfiles_testssl_sh_version }}/testssl.sh"
    dest: "{{ dotfiles_system_user_local_bin_dir }}/testssl.sh"
    state: link
