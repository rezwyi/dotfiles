---
- name: Ensure all directories exists
  ansible.builtin.file:
    path: "{{ __item }}"
    owner: "{{ dotfiles_system_username }}"
    group: "{{ dotfiles_system_user_group }}"
    mode: "0755"
    state: directory
  loop:
    - "{{ dotfiles_yc_disk_config_dir }}"
    - "{{ dotfiles_yc_disk_dir }}"
  loop_control:
    loop_var: __item

- name: Generate Yandex.Disk config
  ansible.builtin.template:
    src: yandex-disk-config.j2
    dest: "{{ dotfiles_yc_disk_config_dir }}/config.cfg"
    owner: "{{ dotfiles_system_username }}"
    group: "{{ dotfiles_system_user_group }}"
    mode: "0644"

- name: Generate systemd unit file
  ansible.builtin.template:
    src: yandex-disk.service.j2
    dest: /etc/systemd/system/yandex-disk.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload daemon
    - Restart yandex-disk
  when:
    - dotfiles_yc_disk_systemd_enabled | bool

- name: Download apt signing key for Yandex.Disk
  ansible.builtin.get_url:
    url: http://repo.yandex.ru/yandex-disk/YANDEX-DISK-KEY.GPG
    dest: /etc/apt/keyrings/yandex-disk.asc
    mode: "0644"
    timeout: 60
  register: __yandex_disk_key_download_status

- name: Dearmor apt signing key for Yandex.Disk
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output /etc/apt/keyrings/yandex-disk.gpg /etc/apt/keyrings/yandex-disk.asc
  when: __yandex_disk_key_download_status is changed

- name: Set permissions on Yandex.Disk apt signing key
  ansible.builtin.file:
    path: /etc/apt/keyrings/yandex-disk.gpg
    owner: root
    group: root
    mode: "0644"
  when: __yandex_disk_key_download_status is changed

- name: Adding apt repository for Yandex.Disk
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/yandex-disk.gpg] http://repo.yandex.ru/yandex-disk/deb/ stable main
    state: present
    filename: yandex-disk

- name: Install yandex-disk binary
  ansible.builtin.apt:
    name: yandex-disk
    update_cache: true
